name: Feature request
description: Propose a traceable project capability
title: "[Feature] "
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Related requirements
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing
  - type: textarea
    id: documentation
    attributes:
      label: Documentation changes
