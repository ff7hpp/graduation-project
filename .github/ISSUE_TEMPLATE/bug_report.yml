name: Bug report
description: Report a reproducible defect
title: "[Bug] "
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Related requirements
  - type: textarea
    id: scope
    attributes:
      label: Scope and affected area
  - type: textarea
    id: acceptance
    attributes:
      label: Expected behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Reproduction and testing evidence
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation changes
